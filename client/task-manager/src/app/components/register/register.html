<div class="auth-container">
  <div class="auth-card">
    
    <div class="auth-tabs">
      <a routerLink="/login" routerLinkActive="active-tab" class="tab">Sign In</a>
      <a routerLink="/register" routerLinkActive="active-tab" class="tab">Sign Up</a>
    </div>

    <h2>Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" class="action-btn" [disabled]="!registerForm.valid" style="width: 100%; justify-content: center;">Sign Up</button>
      
      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Sign in here</a>
      </div>
    </form>
  </div>
</div>
