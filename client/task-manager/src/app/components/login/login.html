<div class="auth-container">
  <div class="auth-card">
    
   <div class="auth-tabs">
      <a routerLink="/login" routerLinkActive="active-tab" class="tab">Sign In</a>
      <a routerLink="/register" routerLinkActive="active-tab" class="tab">Sign Up</a>
    </div>

    <h2>Welcome Back</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" class="action-btn" [disabled]="!loginForm.valid" style="width: 100%; justify-content: center;">Sign In</button>
      
      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Sign up here</a>
      </div>
    </form>
  </div>
</div>
